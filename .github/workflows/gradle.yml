name: Java CI

# Started by hand only (Actions -> Run workflow): no builds on push or pull requests.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jar as a release (tag from hiveko_release)
        type: boolean
        default: false

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: HeadBrowser Build
          path: build/libs/*.jar
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: 'build/libs/*.jar'

      # Publishes the jar as a release of this fork, tagged with hiveko_release from
      # gradle.properties, unless that release already exists (only from a manual run with publish ticked).
      - name: Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls build/libs/*.jar | grep -v sources)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "Head Browser $TAG" \
            --notes "Head Browser 2.6.4 by TheVoidBlock for Minecraft 26.2 (Fabric), Vanilla Finest build: the browse button sits in the icon rows of the title and pause screens (right after Minecraft's own icons) and shows a random head; in a world the button, the key and taking heads work only in creative. Requires Fabric API, Fabric Language Kotlin and owo-lib."
