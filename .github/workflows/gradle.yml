name: Java CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the jar as a release (tag from hiveko_release)
        type: boolean
        default: false

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: HeadBrowser Build
          path: build/libs/*.jar

      - name: Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls build/libs/*.jar | grep -v sources)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "Head Browser $TAG" \
            --notes "Unofficial fix of [Head Browser](https://modrinth.com/mod/headbrowser) 1.0-Beta.2 by TheVoidBlock for Minecraft 1.21.1 (Fabric): the head database is downloaded in the background (the game no longer waits for it at startup) from the Minecraft Heads API that Head Browser 2.6 uses (the old /scripts/api.php no longer answers). Requires Fabric API and owo-lib."

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4