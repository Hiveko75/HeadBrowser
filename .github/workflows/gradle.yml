name: Java CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # owo-lib for Minecraft 26.3 is not published on a Maven repository yet:
      # build the community port (Hiveko75/owo-lib, branch port-26.3) and install it into Maven Local.
      - name: Check out owo-lib 26.3 port
        uses: actions/checkout@v4
        with:
          repository: Hiveko75/owo-lib
          ref: port-26.3
          path: .owo-lib

      - name: Install owo-lib into Maven Local
        working-directory: .owo-lib
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: HeadBrowser Build
          path: build/libs/*.jar

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # owo-lib for Minecraft 26.3 is not published on a Maven repository yet:
      # build the community port (Hiveko75/owo-lib, branch port-26.3) and install it into Maven Local.
      - name: Check out owo-lib 26.3 port
        uses: actions/checkout@v4
        with:
          repository: Hiveko75/owo-lib
          ref: port-26.3
          path: .owo-lib

      - name: Install owo-lib into Maven Local
        working-directory: .owo-lib
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
