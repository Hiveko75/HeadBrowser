name: Java CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # owo-lib for Minecraft 26.3 is not published on a Maven repository yet:
      # build the community port (Hiveko75/owo-lib, branch port-26.3) and install it into Maven Local.
      - name: Check out owo-lib 26.3 port
        uses: actions/checkout@v4
        with:
          repository: Hiveko75/owo-lib
          ref: port-26.3
          path: .owo-lib

      - name: Install owo-lib into Maven Local
        working-directory: .owo-lib
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: HeadBrowser Build
          path: build/libs/*.jar

      # Publishes the jar as a release of this fork, tagged with hiveko_release from
      # gradle.properties, unless that release already exists (only on port-26.3 pushes).
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/port-26.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls build/libs/*.jar | grep -v sources)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "Head Browser $TAG" \
            --notes "Unofficial port of [Head Browser](https://modrinth.com/mod/headbrowser) by TheVoidBlock to Minecraft 26.3 (Fabric). The browse button in the title and pause screens shows a random head again (as in 2.6.1). Requires Fabric API, Fabric Language Kotlin and owo-lib (26.3 port)."
